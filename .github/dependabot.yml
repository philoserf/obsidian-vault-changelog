version: 2
updates:
  # `bun`, not `npm`: the npm ecosystem bumps package.json but leaves bun.lock
  # stale, which `bun install --frozen-lockfile` in CI then rejects.
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      dependencies:
        patterns: ["*"]
    assignees: [philoserf]
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
    assignees: [philoserf]
    commit-message:
      prefix: chore
